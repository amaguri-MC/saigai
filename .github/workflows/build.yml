name: apicheck
on: push
jobs:
  j:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - working-directory: calamities
        run: ./gradlew compileJava -q
      - run: |
          J=$(find ~/.gradle -name 'minecraft-clientOnly*.jar' -o -name 'minecraft-merged*.jar' | grep -v sources | head -1); echo "JAR=$J"
          for c in net.minecraft.client.renderer.fog.environment.AtmosphericFogEnvironment net.minecraft.client.renderer.fog.environment.FogEnvironment net.minecraft.client.renderer.fog.FogData; do echo "=== $c"; javap -p -cp "$J" $c; done
